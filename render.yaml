# SyncBoard AI+ — Render Blueprint
# 1. Push this repo to GitHub
# 2. Render Dashboard → New + → Blueprint → select repo
# 3. When prompted, paste RESEND_API_KEY
# 4. After both services are live, redeploy syncboard-api if CORS fails (WEB_ORIGIN wiring)
#
# Docs: docs/DEPLOY_RENDER.md

services:
  # ── API (Express + Socket.io + Prisma) ─────────────────────────────────────
  - type: web
    name: syncboard-api
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: heuristic
      - key: DATABASE_URL
        value: file:./dev.db
      # Frontend URL — used in verification emails (Resend) and CORS
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: syncboard-web
          envVarKey: RENDER_EXTERNAL_URL
      # Paste at blueprint sync: https://resend.com → API Keys
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "SyncBoard <onboarding@resend.dev>"
    disk:
      name: syncboard-data
      mountPath: /app/apps/server/prisma
      sizeGB: 1

  # ── Web (Next.js 15) ───────────────────────────────────────────────────────
  - type: web
    name: syncboard-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace apps/web
    startCommand: npm run start --workspace apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: syncboard-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: syncboard-api
          envVarKey: RENDER_EXTERNAL_URL
